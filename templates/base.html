<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} - Калькулятор Комус</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f6f9;
        }
        .header-bg {
            background-color: #1e3a8a; /* Темно-синий для делового вида */
        }
        .btn-primary {
            background-color: #2563eb;
            transition: background-color 0.3s ease;
        }
        .btn-primary:hover {
            background-color: #1d4ed8;
        }
        .table-header {
            background-color: #e5e7eb; /* Светло-серый для заголовков таблицы */
        }
        .table-row:hover {
            background-color: #f3f4f6; /* Hover эффект для строк таблицы */
        }
        .shadow-card {
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); /* Тень для карточек */
        }
        .input-focus:focus {
            ring-color: #3b82f6;
            border-color: #3b82f6;
        }
    </style>
</head>
<body class="bg-gray-100">
    <nav class="header-bg p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <a href="/" class="text-white text-lg font-semibold">Калькулятор Комус</a>
            <div class="space-x-4">
                <a href="/" class="text-white hover:text-gray-200 font-medium">Калькулятор TCO</a>
                <a href="/forecast" class="text-white hover:text-gray-200 font-medium">Прогноз спроса</a>
            </div>
        </div>
    </nav>
    <div class="container mx-auto mt-6">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
